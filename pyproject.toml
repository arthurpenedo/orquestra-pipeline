[project]
name = "orquestra-pipeline"
version = "0.1.0"
description = "Orquestração com Prefect de um pipeline bronze/prata/ouro em DuckDB, com checagens de qualidade"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["prefect>=3", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
